# Runs the website locally in a production-like container.
#
#   Build the image: ./gradlew :app:buildImage
#         Start app: docker compose up app
#          Stop all: docker compose down

services:
  app:
    image: nathanfallet:latest
    environment:
      PORT: 8080
      # Optional: raises the GitHub API rate limit used for star counts.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports:
      - '8080:8080'
